<title>Plan de Soi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap">
<style>
/* Concept : un foyer plutôt qu'un cabinet. Lumière chaude en haut de page, grands arrondis, quatre piliers (Lucidité, Régulation, Performance, Autonomie) qui montent au fil des réponses. Une colonne, texte aligné à gauche. */
:root {
  --bg: #f8efe4;
  --surface: #fffaf3;
  --surface-2: #f0e2d0;
  --fg: #3b2a22;
  --muted: #7b6657;
  --line: rgba(59, 42, 34, 0.16);
  --glow: rgba(235, 160, 95, 0.3);
  --accent: #b8541e;
  --accent-ink: #fff8ef;
  --accent-soft: rgba(184, 84, 30, 0.1);
  --steel: #b09a89;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #241813;
    --surface: #2f2019;
    --surface-2: #3c2a21;
    --fg: #f6eadd;
    --muted: #c1ab98;
    --line: rgba(246, 234, 221, 0.16);
    --glow: rgba(240, 163, 94, 0.16);
    --accent: #f0a35e;
    --accent-ink: #2b1508;
    --accent-soft: rgba(240, 163, 94, 0.14);
    --steel: #8f7767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #241813;
  --surface: #2f2019;
  --surface-2: #3c2a21;
  --fg: #f6eadd;
  --muted: #c1ab98;
  --line: rgba(246, 234, 221, 0.16);
  --glow: rgba(240, 163, 94, 0.16);
  --accent: #f0a35e;
  --accent-ink: #2b1508;
  --accent-soft: rgba(240, 163, 94, 0.14);
  --steel: #8f7767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(120% 60% at 85% -8%, var(--glow), transparent 62%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.6;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.app { max-width: 36rem; margin-inline: auto; padding-inline: 1.25rem; padding-block: 1.25rem 3rem; display: flex; flex-direction: column; gap: 1.5rem; min-height: 100vh; min-height: 100dvh; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.brand { display: flex; align-items: center; gap: 0.6rem; }
.brand img { height: 1.3rem; width: auto; flex: none; }
.logo-big { height: 3.6rem; width: auto; align-self: flex-start; }
.step { font-variant-numeric: tabular-nums; }

.ruler { display: flex; gap: 3px; align-items: center; height: 10px; }
.ruler i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); transition: background 0.3s, height 0.3s; }
.ruler i.done { background: var(--accent); }
.ruler i.now { background: var(--accent); height: 10px; }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.view { animation: rise 0.4s ease both; display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

h1, h2 { font-family: var(--font-display); font-weight: 500; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(3.2rem, 15vw, 4.8rem); letter-spacing: -0.015em; }
h2 { font-size: clamp(1.65rem, 6.6vw, 2.2rem); }
h1:focus, h2:focus { outline: none; }
p { margin: 0; }
.sig { font-family: var(--font-display); font-style: italic; font-size: clamp(1.25rem, 5vw, 1.5rem); color: var(--accent); line-height: 1.3; text-wrap: balance; }
.lead { color: var(--muted); max-width: 34rem; }

.field { display: flex; flex-direction: column; gap: 0.6rem; }
.field label { font-size: 0.8125rem; font-weight: 600; color: var(--muted); }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 0.9rem 1.1rem; min-height: 3.4rem;
}
textarea { min-height: 9.5rem; resize: vertical; line-height: 1.5; }
input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; }
input[type="text"]:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

button { font: inherit; cursor: pointer; border-radius: 999px; min-height: 3.1rem; padding: 0.7rem 1.6rem; border: 1.5px solid transparent; font-weight: 600; }
button:focus-visible, .opt:has(input:focus-visible), .cta a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-ink); }
.primary:disabled { opacity: 0.35; cursor: not-allowed; }
.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.ghost:hover { border-color: var(--muted); }
.meta { color: var(--muted); font-size: 0.875rem; }

/* piliers */
.pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; align-items: end; height: 11rem; border-bottom: 3px solid var(--muted); padding-inline: 0.2rem; }
.pillar { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; }
.pillar .shaft {
  height: var(--h, 12%);
  border-radius: 14px 14px 0 0;
  background: linear-gradient(to top, var(--steel), color-mix(in srgb, var(--steel) 60%, transparent));
  transition: height 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.pillar.top .shaft { background: linear-gradient(to top, color-mix(in srgb, var(--accent) 70%, var(--bg)), var(--accent)); }
.pillar.weak .shaft { background: transparent; border: 2px dashed var(--muted); border-bottom: 0; }
.labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; padding-inline: 0.2rem; }
.labels div { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
.labels .label { font-size: 0.6rem; letter-spacing: 0.04em; overflow-wrap: anywhere; color: var(--fg); }
.labels .count { font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; font-size: 0.8125rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
.legend i { width: 0.8rem; height: 0.8rem; display: inline-block; border-radius: 3px; }
.legend .k-top { background: var(--accent); }
.legend .k-weak { border: 2px dashed var(--muted); }
.decor { margin-top: 0.5rem; }

/* questions */
.qnum { font-variant-numeric: tabular-nums; }
.opts { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.65rem; min-width: 0; }
.opt { position: relative; display: flex; gap: 0.9rem; align-items: flex-start; padding: 1rem 1.1rem; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; cursor: pointer; min-height: 3.6rem; transition: border-color 0.2s, background 0.2s; }
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .mark { flex: none; width: 1.2rem; height: 1.2rem; margin-top: 0.15rem; border: 1.5px solid var(--muted); border-radius: 50%; display: grid; place-items: center; }
.opt .mark::after { content: ""; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform 0.15s; }
.opt span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:checked) .mark { border-color: var(--accent); }
.opt:has(input:checked) .mark::after { transform: scale(1); }
.nav { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 0.5rem; }
.nav .primary { flex: 1; max-width: 15rem; }

.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; animation: fill 2.7s linear forwards; }
@keyframes fill { to { width: 100%; } }

/* conclusion */
.profile { font-family: var(--font-display); font-style: italic; font-size: clamp(2.2rem, 10vw, 3.2rem); color: var(--accent); line-height: 1.05; }
.synth { font-size: 1.125rem; }
.block { border-top: 1px solid var(--line); padding-top: 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.block p:not(.label) { max-width: 34rem; }
.words { gap: 1.1rem; }
.words blockquote { margin: 0; font-family: var(--font-display); font-style: italic; font-size: 1.3rem; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-line; }
.words .label { margin-bottom: 0.2rem; }
.take { font-family: var(--font-display); font-style: italic; font-size: clamp(1.55rem, 6.5vw, 2rem); line-height: 1.2; text-wrap: balance; }
.cta { background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 1.4rem; display: flex; flex-direction: column; gap: 1rem; align-items: flex-start; }
.cta a { display: inline-flex; align-items: center; text-decoration: none; padding: 0.7rem 1.6rem; border-radius: 999px; font-weight: 600; min-height: 3.1rem; }
.actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
.status { color: var(--muted); font-size: 0.875rem; min-height: 1.4em; }
#fallback { display: none; min-height: 8rem; }
#fallback.on { display: block; }

footer { padding-top: 1rem; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  .view { animation: none; }
  .pillar .shaft, .ruler i, .opt, .opt .mark::after { transition: none; }
  .bar span { animation-duration: 0.01s; }
}
</style>

  { type: "heart", t: "Si vous en aviez le choix, effaceriez-vous votre pire souvenir ou revivriez-vous le meilleur ?", o: [

  { type: "choice", t: "On vous offre une semaine entière sans aucune obligation. Vous commencez par quoi ?", o: [

    ["Une décision que je n’ose pas encore prendre", "A", "L"],

  { type: "open", short: "Votre « et si… »", t: "Quel « et si… » vous hante le plus ?" },
  { type: "choice", t: "Dans un groupe, quel est votre rôle naturel ?", o: [

    ["Celui qui pousse le groupe à viser plus haut", "P", "R"],

  { type: "open", short: "Ce qui cesserait d’importer", t: "Si votre vie devait se terminer dans un an, laquelle de vos inquiétudes actuelles cesserait instantanément d’avoir de l’importance ?" },
  { type: "choice", t: "Après un échec important, qu’est-ce qui vous remet debout en premier ?", o: [
    ["Un nouveau plan d’action clair", "P", "A"],
    ["Comprendre ce qui s’est réellement passé", "L", "P"],
    ["La conviction que la suite m’appartient", "A", "R"],
    ["Retrouver mon calme et mon énergie", "R", "L"] ] },
  { type: "choice", t: "Quelle est votre relation à la routine ?", o: [
    ["Je la remets régulièrement en question pour voir si elle me sert encore", "L", "A"],

    ["Je me construis mes propres règles, pas celles des autres", "A", "L"],
    ["Mes habitudes solides me portent vers mes résultats", "P", "R"] ] },
  { type: "choice", t: "Une décision importante se présente. Comment procédez-vous ?", o: [

  { type: "choice", t: "Vos proches diraient de vous que vous êtes plutôt…", o: [

    ["Quelqu’un d’exigeant", "P", "L"],
    ["Quelqu’un de profond", "L", "R"],
    ["Quelqu’un de posé", "R", "A"] ] },
  { type: "choice", t: "Le soir, qu’est-ce qui vous procure le plus de satisfaction ?", o: [
    ["Avoir agi selon mes choix et non selon ceux des autres", "A", "L"],
    ["Avoir gardé mon calme quand c’était tendu", "R", "A"],
    ["Avoir compris quelque chose de nouveau sur moi", "L", "P"],
    ["Avoir accompli quelque chose de concret", "P", "R"] ] },
  { type: "open", short: "Votre conseil à votre enfant", t: "Si un jour votre enfant vivait la vie que vous vivez maintenant, que lui conseilleriez-vous de changer ?" }
];
var TOTAL = QUESTIONS.length;
var NCHOICE = QUESTIONS.filter(function (q) { return q.type === "choice"; }).length;

var state = { name: "", i: 0, ans: [], txt: {}, screen: "intro" };
var view = document.getElementById("view");
var stepEl = document.getElementById("step");
var rulerEl = document.getElementById("ruler");
var timer = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtName(s) {
  return s.trim().replace(/\s+/g, " ").split(/([\s-])/).map(function (p) {
    return p ? p.charAt(0).toUpperCase() + p.slice(1) : p;
  }).join("");
}
function pad(n) { return (n < 10 ? "0" : "") + n; }

function setChrome() {
  var quiz = state.screen === "quiz";
  stepEl.hidden = !quiz; rulerEl.hidden = !quiz;
  if (quiz) {
    stepEl.textContent = pad(state.i + 1) + " / " + pad(TOTAL);
    var h = "";
    for (var k = 0; k < TOTAL; k++) h += '<i class="' + (k < state.i ? "done" : k === state.i ? "now" : "") + '"></i>';
    rulerEl.innerHTML = h;
  }
}
function show(html, focusId) {
  view.innerHTML = '<div class="view">' + html + "</div>";
  setChrome();
  var f = focusId && document.getElementById(focusId);
  if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
  window.scrollTo(0, 0);
}

function decorPillars() {
  return '<div class="decor" aria-hidden="true"><div class="pillars" style="height:6rem">' +
    [38, 70, 52, 92].map(function (h, n) {
      return '<div class="pillar' + (n === 3 ? " top" : "") + '"><div class="shaft" style="--h:' + h + '%"></div></div>';
    }).join("") + "</div></div>";
}

function renderIntro() {
  state.screen = "intro";
  show(
    '<img class="logo-big" src="' + LOGO + '" alt="A4P Mental">' +
    '<p class="label">Développement personnel · A4P Mental</p>' +
    '<h1 id="t" tabindex="-1">Plan de Soi</h1>' +
    '<p class="sig">Une architecture mentale. Pas une béquille émotionnelle.</p>' +
    '<p class="lead">Prenez un moment pour vous. ' + TOTAL + " questions, environ douze minutes, sans bonne ni mauvaise réponse. À la fin, vous recevez une conclusion écrite pour vous : vos fondations, votre chantier et votre prochain pas.</p>" +
    '<form id="start" class="field" autocomplete="on">' +
      '<label for="name">Comment vous appelez-vous ?</label>' +
      '<input type="text" id="name" name="given-name" autocomplete="given-name" maxlength="40" placeholder="Votre prénom" value="' + esc(state.name) + '">' +
      '<button type="submit" class="primary" id="go">Commencer</button>' +
    "</form>" +
    '<p class="meta">Vos réponses restent sur votre appareil. Rien n’est envoyé.</p>' +
    decorPillars()
  );
  var input = document.getElementById("name"), go = document.getElementById("go");
  function sync() { go.disabled = input.value.trim().length < 1; }
  sync();
  input.addEventListener("input", sync);
  document.getElementById("start").addEventListener("submit", function (e) {
    e.preventDefault();
    if (input.value.trim().length < 1) return;
    state.name = fmtName(input.value);
    state.i = 0; state.ans = []; state.txt = {};
    renderQuestion();
  });
}

function renderQuestion() {
  state.screen = "quiz";
  var q = QUESTIONS[state.i], last = state.i === TOTAL - 1, body;
  if (q.type !== "open") {
    body = '<fieldset class="opts"><legend class="sr">' + esc(q.t) + "</legend>" +
      q.o.map(function (o, n) {
        return '<label class="opt"><input type="radio" name="q" value="' + n + '"' + (state.ans[state.i] === n ? " checked" : "") + '><span class="mark" aria-hidden="true"></span><span>' + esc(o[0]) + "</span></label>";
      }).join("") + "</fieldset>";
  } else {
    body = '<div class="field"><label for="open" class="sr">Votre réponse</label>' +
      '<textarea id="open" maxlength="500" placeholder="Écrivez librement, quelques lignes suffisent.">' + esc(state.txt[state.i] || "") + "</textarea>" +
      '<p class="meta">Prenez le temps. Personne d’autre ne lira votre réponse. Elle est facultative, vous pouvez passer.</p></div>';
  }
  show(
    '<p class="label qnum">Question ' + (state.i + 1) + " sur " + TOTAL + "</p>" +
    '<h2 id="t" tabindex="-1">' + esc(q.t) + "</h2>" + body +
    '<div class="nav"><button type="button" class="ghost" id="back"' + (state.i === 0 ? ' style="visibility:hidden"' : "") + ">Retour</button>" +
    '<button type="button" class="primary" id="next"></button></div>',
    "t"
  );
  var next = document.getElementById("next");
  function label() {
    var txt = last ? "Voir mon plan" : "Suivant";
    if (q.type === "open" && !document.getElementById("open").value.trim()) txt = last ? "Passer et voir mon plan" : "Passer";
    next.textContent = txt;
  }
  if (q.type !== "open") {
    next.textContent = last ? "Voir mon plan" : "Suivant";
    next.disabled = state.ans[state.i] === undefined;
    view.querySelectorAll('input[name="q"]').forEach(function (r) {
      r.addEventListener("change", function () { state.ans[state.i] = parseInt(r.value, 10); next.disabled = false; });
    });
  } else {
    var ta = document.getElementById("open");
    label();
    ta.addEventListener("input", function () { state.txt[state.i] = ta.value; label(); });
  }
  next.addEventListener("click", function () {
    if (q.type === "open") state.txt[state.i] = document.getElementById("open").value;
    if (last) renderLoading(); else { state.i++; renderQuestion(); }
  });
  document.getElementById("back").addEventListener("click", function () {
    if (q.type === "open") state.txt[state.i] = document.getElementById("open").value;
    if (state.i > 0) { state.i--; renderQuestion(); }
  });
}

function renderLoading() {
  state.screen = "loading";
  var msgs = ["Lecture de vos réponses", "Mise en regard des quatre piliers", "Rédaction de votre conclusion"];
  show(
    '<p class="label">Un instant, ' + esc(state.name) + "</p>" +
    '<h2 id="t" tabindex="-1">Construction de votre plan</h2>' +
    '<p class="lead" id="lmsg" aria-live="polite">' + msgs[0] + "</p>" +
    '<div class="bar" aria-hidden="true"><span></span></div>', "t"
  );
  var n = 0;
  clearInterval(timer);
  timer = setInterval(function () {
    n++;
    var el = document.getElementById("lmsg");
    if (n < msgs.length && el) { el.textContent = msgs[n]; return; }
    clearInterval(timer);
    renderResult();
  }, 900);
}

function compute() {
  var p = { L: 0, R: 0, P: 0, A: 0 }, s = { L: 0, R: 0, P: 0, A: 0 };
  QUESTIONS.forEach(function (q, i) {
    if (q.type !== "choice") return;
    var o = q.o[state.ans[i]];
    if (!o) return;
    p[o[1]]++; s[o[2]]++;
  });
  var rank = ORDER.slice().sort(function (a, b) {
    return (p[b] - p[a]) || (s[b] - s[a]) || (ORDER.indexOf(a) - ORDER.indexOf(b));
  });
  return { p: p, rank: rank, top: rank[0], second: rank[1], weak: rank[3] };
}

function summaryText(r) {
  var a = AX[r.top], w = AX[r.weak];
  var txt = state.name + ", vos réponses dessinent un profil de type « " + a.profile + " ». " + a.line + " " + AX[r.second].mod;
  if (r.p[r.top] - r.p[r.weak] <= 2) {
    txt += " Vos quatre piliers sont proches les uns des autres. C’est un profil équilibré, et votre travail consiste moins à rattraper un retard qu’à approfondir ce que vous maîtrisez déjà.";
  } else {
    txt += " Votre pilier le moins sollicité est la " + w.name.toLowerCase() + ", et c’est là que se trouve votre meilleur levier de progression.";
  }
  return txt;
}

function heartLines() {
  var out = [];
  QUESTIONS.forEach(function (q, i) {
    if (q.type !== "heart") return;
    var o = q.o[state.ans[i]];
    if (o) out.push([o[0], o[1]]);
  });
  return out;
}

function renderResult() {
  state.screen = "result";
  var r = compute(), a = AX[r.top], w = AX[r.weak];
  var maxc = Math.max.apply(null, ORDER.map(function (k) { return r.p[k]; })) || 1;
  var pil = "", lab = "";
  ORDER.forEach(function (k) {
    var h = 12 + 88 * (r.p[k] / maxc);
    var cls = k === r.top ? " top" : k === r.weak ? " weak" : "";
    pil += '<div class="pillar' + cls + '"><div class="shaft" data-h="' + h.toFixed(1) + '%"></div></div>';
    lab += '<div><span class="label">' + AX[k].name + '</span><span class="count">' + r.p[k] + " / " + NCHOICE + "</span></div>";
  });
  var words = "", wordsArr = [];
  QUESTIONS.forEach(function (q, i) {
    var v = (state.txt[i] || "").trim();
    if (q.type === "open" && v) { words += '<div><p class="label">' + esc(q.short) + "</p><blockquote>" + esc(v) + "</blockquote></div>"; wordsArr.push([q.short, v]); }
  });
  var hl = heartLines();
  var heart = hl.length ? '<div class="block"><p class="label">Vos choix de cœur</p>' +
    hl.map(function (x) { return "<p><strong>" + esc(x[0]) + ".</strong> " + esc(x[1]) + "</p>"; }).join("") + "</div>" : "";
  show(
    '<p class="label">Analyse personnalisée · A4P Mental</p>' +
    '<h2 id="t" tabindex="-1">' + esc(state.name) + ", voici votre plan.</h2>" +
    '<p class="profile">' + a.profile + "</p>" +
    '<p class="synth">' + esc(summaryText(r)) + "</p>" +
    '<div role="img" aria-label="Quatre piliers : ' + ORDER.map(function (k) { return AX[k].name + " " + r.p[k] + " sur " + NCHOICE; }).join(", ") + '">' +
      '<div class="pillars">' + pil + '</div><div class="labels">' + lab + "</div></div>" +
    '<div class="legend"><span><i class="k-top"></i>Votre fondation</span><span><i class="k-weak"></i>Votre chantier</span></div>' +
    '<div class="block"><p class="label">Votre fondation · ' + a.name + "</p><p>" + esc(a.strength) + " " + esc(a.watch) + "</p></div>" +
    '<div class="block"><p class="label">Votre chantier · ' + w.name + "</p><p>" + esc(w.gap) + "</p></div>" +
    '<div class="block"><p class="label">Votre prochain pas · sept jours</p><p>' + esc(w.step) + "</p></div>" +
    heart +
    (words ? '<div class="block words"><p class="label">Vos mots</p>' + words + "</div>" : "") +
    '<div class="block"><p class="label">Une question à emporter, ' + esc(state.name) + '</p><p class="take">« ' + esc(w.q) + " »</p></div>" +
    '<div class="cta"><p>Ce plan pose des fondations. Pour les transformer en méthode, échangez avec Alexandre Griffet, Architecte Mental.</p>' +
      (CONTACT_URL ? '<a class="primary" href="' + esc(CONTACT_URL) + '" target="_blank" rel="noopener">Prendre contact</a>' : "") + "</div>" +
    '<div class="actions"><button type="button" class="primary" id="pdf">Télécharger en PDF</button><button type="button" class="ghost" id="copy">Copier mon plan</button><button type="button" class="ghost" id="again">Recommencer</button></div>' +
    '<p class="status" id="status" role="status"></p>' +
    '<label for="fallback" class="sr">Texte de votre plan à copier</label><textarea id="fallback" readonly></textarea>',
    "t"
  );
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      view.querySelectorAll(".shaft[data-h]").forEach(function (el) { el.style.setProperty("--h", el.getAttribute("data-h")); });
    });
  });
  document.getElementById("again").addEventListener("click", renderIntro);
  document.getElementById("pdf").addEventListener("click", function () { buildPdf(r, a, w, hl, wordsArr); });
  document.getElementById("copy").addEventListener("click", function () {
    var text = state.name + ", voici votre plan\n\nProfil : " + a.profile + "\n\n" + summaryText(r) +
      "\n\nVotre fondation (" + a.name + ")\n" + a.strength + " " + a.watch +
      "\n\nVotre chantier (" + w.name + ")\n" + w.gap +
      "\n\nVotre prochain pas\n" + w.step +
      (hl.length ? "\n\nVos choix de cœur\n" + hl.map(function (x) { return x[0] + ". " + x[1]; }).join("\n") : "") +
      "\n\nUne question à emporter\n« " + w.q + " »\n\nA4P Mental · Alexandre Griffet, Architecte Mental";
    var st = document.getElementById("status"), fb = document.getElementById("fallback");
    function fallback() {
      fb.value = text; fb.classList.add("on"); fb.focus(); fb.select();
      st.textContent = "Sélectionnez le texte ci-dessous et copiez-le.";
    }
    try {
      navigator.clipboard.writeText(text).then(function () { st.textContent = "Plan copié."; }, fallback);
    } catch (e) { fallback(); }
  });
}

/* Export PDF : A4, une à deux pages, texte réel (sélectionnable) */
function buildPdf(r, a, w, hl, wordsArr) {
  var st = document.getElementById("status");
  var Lib = window.jspdf && window.jspdf.jsPDF;
  if (!Lib) { if (st) st.textContent = "Le PDF n’est pas disponible pour le moment. Utilisez « Copier mon plan »."; return; }
  try {
    var doc = new Lib({ unit: "pt", format: "a4" });
    var PW = 595.28, PH = 841.89, M = 52, CW = PW - 2 * M, y = 0;
    var C = { ink: [59, 42, 34], muted: [123, 102, 87], accent: [184, 84, 30], steel: [176, 154, 137], sand: [248, 239, 228], line: [226, 213, 199] };
    function tc(c) { doc.setTextColor(c[0], c[1], c[2]); }
    function dc(c) { doc.setDrawColor(c[0], c[1], c[2]); }
    function fc(c) { doc.setFillColor(c[0], c[1], c[2]); }
    var dateTxt = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    function header() {
      try { doc.addImage(LOGO, "PNG", M, 38, 58, 23.5); } catch (e) {}
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); tc(C.muted);
      doc.text("Plan de Soi · " + dateTxt, PW - M, 54, { align: "right" });
      dc(C.line); doc.setLineWidth(0.6); doc.line(M, 74, PW - M, 74);
      y = 104;
    }
    function ensure(h) { if (y + h > PH - 70) { doc.addPage(); header(); } }
    function lines(txt, font, style, size, color, lead) {
      doc.setFont(font, style); doc.setFontSize(size);
      doc.splitTextToSize(txt, CW).forEach(function (ln) {
        ensure(lead);
        doc.setFont(font, style); doc.setFontSize(size); tc(color);
        doc.text(ln, M, y); y += lead;
      });
    }
    function label(txt) {
      ensure(40);
      doc.setFont("helvetica", "bold"); doc.setFontSize(8); tc(C.muted);
      if (doc.setCharSpace) doc.setCharSpace(1);
      doc.text(txt.toUpperCase(), M, y);
      if (doc.setCharSpace) doc.setCharSpace(0);
      y += 16;
    }
    function section(lab) {
      ensure(70); y += 8; dc(C.line); doc.setLineWidth(0.6); doc.line(M, y, PW - M, y); y += 20; label(lab);
    }

    header();
    lines(state.name + ", voici votre plan.", "times", "normal", 28, C.ink, 33);
    y += 6;
    lines(a.profile, "times", "italic", 24, C.accent, 28);
    y += 8;
    lines(summaryText(r), "helvetica", "normal", 11, C.ink, 16.5);
    y += 22;

    /* piliers */
    var maxc = Math.max.apply(null, ORDER.map(function (k) { return r.p[k]; })) || 1;
    ensure(190);
    var base = y + 100, colW = CW / 4, barW = 46, maxH = 96;
    ORDER.forEach(function (k, n) {
      var h = maxH * (0.12 + 0.88 * (r.p[k] / maxc));
      var x = M + n * colW + (colW - barW) / 2;
      if (k === r.weak) {
        doc.setLineDashPattern([3, 3], 0); dc(C.muted); doc.setLineWidth(1.2);
        doc.roundedRect(x, base - h, barW, h + 14, 8, 8, "S");
        doc.setLineDashPattern([], 0);
        fc([255, 255, 255]); doc.rect(x - 3, base, barW + 6, 16, "F");
      } else {
        fc(k === r.top ? C.accent : C.steel);
        doc.roundedRect(x, base - h, barW, h, 8, 8, "F");
        doc.rect(x, base - 10, barW, 10, "F");
      }
    });
    dc(C.muted); doc.setLineWidth(1.8); doc.line(M, base, PW - M, base);
    ORDER.forEach(function (k, n) {
      var cx = M + n * colW + colW / 2;
      doc.setFont("helvetica", "bold"); doc.setFontSize(8); tc(C.ink);
      doc.text(AX[k].name.toUpperCase(), cx, base + 16, { align: "center" });
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); tc(C.muted);
      doc.text(r.p[k] + " / " + NCHOICE, cx, base + 29, { align: "center" });
    });
    y = base + 52;
    fc(C.accent); doc.rect(M, y - 7, 8, 8, "F");
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); tc(C.muted);
    doc.text("Votre fondation", M + 14, y);
    doc.setLineDashPattern([2, 2], 0); dc(C.muted); doc.setLineWidth(1); doc.rect(M + 112, y - 7, 8, 8, "S");
    doc.setLineDashPattern([], 0);
    doc.text("Votre chantier", M + 126, y);
    y += 16;

    section("Votre fondation · " + a.name);
    lines(a.strength + " " + a.watch, "helvetica", "normal", 11, C.ink, 16.5);
    section("Votre chantier · " + w.name);
    lines(w.gap, "helvetica", "normal", 11, C.ink, 16.5);
    section("Votre prochain pas · sept jours");
    lines(w.step, "helvetica", "normal", 11, C.ink, 16.5);
    if (hl.length) {
      section("Vos choix de cœur");
      hl.forEach(function (x) {
        ensure(44);
        lines(x[0] + ".", "helvetica", "bold", 11, C.ink, 16.5);
        lines(x[1], "helvetica", "normal", 11, C.ink, 16.5);
        y += 4;
      });
    }
    if (wordsArr.length) {
      section("Vos mots");
      wordsArr.forEach(function (x) {
        ensure(60);
        doc.setFont("helvetica", "bold"); doc.setFontSize(8); tc(C.muted); doc.text(x[0], M, y); y += 15;
        lines(x[1], "times", "italic", 14, C.ink, 19);
        y += 10;
      });
    }
    section("Une question à emporter, " + state.name);
    lines("« " + w.q + " »", "times", "italic", 18, C.accent, 24);
    y += 22;

    /* invitation */
    ensure(96);
    fc(C.sand); doc.roundedRect(M, y, CW, 78, 10, 10, "F");
    doc.setFont("helvetica", "normal"); doc.setFontSize(10.5); tc(C.ink);
    doc.splitTextToSize("Ce plan pose des fondations. Pour les transformer en méthode, échangez avec Alexandre Griffet, Architecte Mental.", CW - 40).forEach(function (ln, n) { doc.text(ln, M + 20, y + 26 + n * 15); });
    if (CONTACT_URL) {
      doc.setFont("helvetica", "bold"); tc(C.accent);
      doc.textWithLink("Prendre rendez-vous : " + CONTACT_URL.replace(/^https?:\/\//, ""), M + 20, y + 62, { url: CONTACT_URL });
    }

    /* pied de page */
    var n = doc.getNumberOfPages();
    for (var i = 1; i <= n; i++) {
      doc.setPage(i);
      dc(C.line); doc.setLineWidth(0.6); doc.line(M, PH - 50, PW - M, PH - 50);
      doc.setFont("helvetica", "normal"); doc.setFontSize(8); tc(C.muted);
      doc.text("A4P Mental · Alexandre Griffet, Architecte Mental", M, PH - 34);
      doc.text(i + " / " + n, PW - M, PH - 34, { align: "right" });
    }
    var clean = state.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "Plan";
    doc.save("Plan-de-Soi-" + clean + ".pdf");
    if (st) st.textContent = "PDF prêt, il se télécharge sur votre appareil.";
  } catch (e) {
    if (st) st.textContent = "Le PDF n’a pas pu être créé. Utilisez « Copier mon plan ».";
  }
}

document.getElementById("hlogo").src = LOGO;
renderIntro();
</script>
